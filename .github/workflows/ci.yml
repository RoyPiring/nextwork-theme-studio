name: audit

on:
  push:
    branches: [main]
  pull_request:
  # Once a week, so a break in the toolchain is found without waiting for
  # somebody to push. GitHub disables a schedule after 60 days of repository
  # inactivity, so expect to switch this back on after a quiet spell.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# The workflow only reads the checked-out code. Nothing here needs write access.
permissions:
  contents: read

jobs:
  # Tests and the audit gate, on both platforms. Development happens on
  # Windows and CI used to run only on Linux, which is how a Windows-specific
  # packaging bug shipped in 1.3.0: every archive was unloadable and the build
  # reported success.
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Named explicitly. Without it these run under PowerShell on the Windows
    # leg and under bash on the Linux one, so the two legs would not be
    # running the same thing.
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to a commit SHA, not a tag. A tag can be moved to
      # point at different code; a SHA cannot.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      # No dependencies, so there is no install step and no lockfile to audit.
      - name: Unit tests
        # No path: node discovers *.test.js itself. A quoted glob is passed
        # through literally by bash on Linux, and an unquoted one is expanded
        # by the shell on some platforms and not others.
        run: node --test

      - name: Run the audit gate
        run: node tools/audit.js

  # assets/*.svg and docs/img/themes.svg are generated from src/scenes.js.
  # If they drift, the files in the repo no longer match the code that made
  # them, and the README shows themes that no longer exist.
  #
  # Linux only. The check compares regenerated bytes against what is committed,
  # and running it on two platforms would make line endings part of the test.
  generated:
    name: generated files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Check generated assets are up to date
        run: |
          node tools/export-scenes.js > /dev/null
          node tools/gallery.js > /dev/null
          # --porcelain, not `git diff`: a new theme adds *untracked* files,
          # which a diff of tracked paths reports as no change at all.
          if [ -n "$(git status --porcelain -- assets docs/img)" ]; then
            echo "Generated files are out of date."
            echo "Run: node tools/export-scenes.js && node tools/gallery.js"
            git status --porcelain -- assets docs/img
            exit 1
          fi

  # The packaging step, which had never run anywhere but one laptop.
  #
  # Windows, because that is what the packaging code targets: it resolves
  # bsdtar out of System32 by full path, since a POSIX toolchain on PATH would
  # otherwise supply GNU tar, which cannot write a zip at all. Verifying it on
  # Linux needs libarchive-tools installed and is a separate change.
  package:
    name: package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Build every browser package
        run: node tools/build.js

      # build.js reads each archive back before reporting success. This checks
      # the other half: that the files it claims to have written are there and
      # are not empty. It looks at whatever the build wrote rather than a list
      # repeated from build.js, so a browser target added there is not built
      # and then silently left unverified.
      - name: Check the archives exist
        shell: bash
        run: |
          shopt -s nullglob
          archives=(dist/*.zip dist/*.xpi)
          if [ ${#archives[@]} -lt 4 ]; then
            echo "expected at least 4 archives, found ${#archives[@]}"
            ls -la dist/ || true
            exit 1
          fi
          fail=0
          for f in "${archives[@]}"; do
            if [ ! -s "$f" ]; then
              echo "empty: $f"
              fail=1
            else
              echo "ok: $f ($(wc -c < "$f") bytes)"
            fi
          done
          exit $fail

  # The one check the branch ruleset requires, and the only reason it has a
  # fixed name.
  #
  # A required check is named after the job that reports it, so putting the
  # matrix directly under this name would have renamed it to "audit
  # (ubuntu-latest)" and "audit (windows-latest)". The rule would then point at
  # a check that no longer exists and would silently stop requiring anything.
  # This job's name never changes, whatever is added above it.
  audit:
    name: audit
    needs: [checks, generated, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job must have succeeded
        run: |
          fail=0
          for pair in \
            "checks:${{ needs.checks.result }}" \
            "generated:${{ needs.generated.result }}" \
            "package:${{ needs.package.result }}"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            echo "$name: $result"
            # Anything that is not success fails this, including "skipped" and
            # "cancelled". A job that did not run has not passed.
            if [ "$result" != "success" ]; then
              fail=1
            fi
          done
          exit $fail
