name: nextwork-theme-studio

# What is worth analysing here is the code that runs in a page the reader is
# signed in to, plus the tools that build it. Everything below is either
# generated or is not code at all, and scanning it costs time on every run
# without ever producing a finding worth reading.
paths-ignore:
  # Wallpapers are embedded images. The file is a few hundred kilobytes of
  # base64 with a thin wrapper, and it is regenerated by a tool.
  - src/wallpapers.js
  # Scenery exported as SVG for inspection. Not loaded by the extension.
  - assets
  # Source artwork and build output.
  - art
  - dist
  - docs
